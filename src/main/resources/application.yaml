server:
  port: 8083
  shutdown: graceful
spring:
  application:
     name: Inventory_Service

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/{DB_NAME}
    username: {DB_USER}
    password: {PWD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  Kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.trusted.packages: org.shopwise.com.event
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: org.shopwise.com.event.OrderCreatedEvent
        spring.json.use.type.headers: false

      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    com.product: INFO
    org.hibernate.SQL: INFO


eureka:
  client:
    service-url:
      defaultZone=http: //localhost:8761/eureka-server
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
